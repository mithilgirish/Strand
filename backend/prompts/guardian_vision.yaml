name: guardian_vision
version: 1
description: Computer Vision prompt for CAD drawing compliance review
variables:
  - submittal_id
template: |
  You are an expert Data Center Engineering QA Inspector.
  Analyze this technical drawing/CAD submittal for {submittal_id}.
  
  Look closely at the visual elements for compliance deviations related to:
  - Safety equipment and valves
  - Clearance zones and spacing
  - Component labels and wire gauges
  
  Return a JSON array of violations found. 
  Format:
  {{
    "violations": [
      {{
        "parameter": "string (e.g., 'safety_valve_presence')",
        "actual": "string (what is seen)",
        "required": "string (what should be there)",
        "deviation_type": "visual_anomaly"
      }}
    ]
  }}
  
  If no violations are visually apparent, return an empty array in the violations key: {{"violations": []}}
