# STRAND — Local Development Stack
# Run: docker compose up
# Access:
#   Web Dashboard: http://localhost:3000
#   Backend API:   http://localhost:8000/docs
#   Neo4j Browser: http://localhost:7474 (user: neo4j / pass: strand_local_dev)

services:
  neo4j:
    image: neo4j:5.13-community
    container_name: strand-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/strand_local_dev"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: strand-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: strand-backend
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: strand_local_dev
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "True"
      PYTHONPATH: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strand-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  neo4j_data:
