services:
  - type: web
    name: strand-backend
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=.. uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "True"
      - key: CORS_ORIGINS
        value: "https://strand-iota.vercel.app,http://localhost:3000"
      - key: BACKEND_URL
        value: "https://strand-87qa.onrender.com"
      # Sensitive keys: sync: false prompts in Render UI without committing secrets to Git
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
